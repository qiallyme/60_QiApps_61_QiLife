name: QiLife CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test QiLife
        run: npm run test:ci

      - name: Build QiLife
        run: npm run build
        env:
          VITE_QI_API_URL: https://api.qially.com
          VITE_SUPABASE_URL: https://emnskvvajdlqixwzjfsm.supabase.co
